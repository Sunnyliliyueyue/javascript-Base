        // 面试题： 请分析执行顺序
        function fn() {
            return new Promise((resolve) => {
                console.log('Promise1')
                fn1()
                setTimeout(() => {
                    console.log('Promise2')
                    resolve()
                    console.log('Promise3')
                }, 0);
            })
        }
        async function fn1() {
            var p = Promise.resolve().then(() => {
                console.log('Promise6')
            })
            await p.then(() => {
                console.log('Promise7')
            })
            console.log('end')
        }
        console.log('script')

        }, 0)
        fn().then(() => {
