<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>构造函数</title>
</head>
<body>
    <script>
        function Cars(color, type){
            this.color = color
            this.type = type
        }

        var newCar = new Cars('green', 'lali002')
        console.log(newCar instanceof Cars ); // true
        
    </script>
</body>
</html>
