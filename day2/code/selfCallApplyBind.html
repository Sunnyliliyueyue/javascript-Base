        // apply
        function myApply(context, argArr) {
            // 判断myApply是否为函数
            if (typeof this !== 'function') {
                throw new TypeError('被调用对象必须是个函数')
            }
            // 判断传入的对象是否是一个数组
            if(argArr && !Array.isArray(argArr) ){
                throw new TypeError('第二个参数必须是数组')
            }
            // 若没有传如上下文对象，默认为全局对象
            context = context === null ? globalThis : context
            // 用Symbol创建唯一的键名，防止名字冲突
            let fn = Symbol('key')
            context[fn] = this      
            const result = Array.isArray(argArr ) ? context[fn](...argArr) : context[fn]()  
            delete context[fn]  
            return result
        }

        Function.prototype.myApply = myApply
        function ILike(...star){
            console.log('我喜欢的明星' + star);
        }
        var arr = ['黄景瑜', '赵丽颖', '刘烨']
        ILike.myApply(window, arr)
